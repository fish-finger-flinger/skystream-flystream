name: Deploy SkyStream Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages Routing
        uses: actions/configure-pages@v5

      - name: Build Repositories Layout
        run: |
          echo "Building repository registry configuration..."
          
          # Generate standard indexing required by SkyStream core application
          cat << 'EOF' > mega_repo.json
          {
            "name": "FlyStream Mirror Repository",
            "description": "Custom verified stream providers.",
            "plugins": [
              {
                "id": "net.flystream.skystream.plugin",
                "name": "FlyStream Extensions",
                "version": "1.0.0",
                "url": "plugins/flystream/manifest.json"
              }
            ]
          }
          EOF

      - name: Upload Pages Package Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Engines
        id: deployment
        uses: actions/deploy-pages@v4
