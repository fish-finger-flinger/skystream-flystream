        run: |
          echo "Building repository registry configuration..."
          
          # Generate the proper structure expected by the app
          cat << 'EOF' > index.json
          [
            {
              "name": "FlyStream Extensions",
              "version": 1,
              "url": "https://github.io",
              "id": "net.flystream.skystream.plugin",
              "authors": ["Developer"],
              "description": "Scrapes and streams content from flystream.net"
            }
          ]
          EOF
          
          # Create a copy named mega_repo.json for absolute coverage
          cp index.json mega_repo.json
